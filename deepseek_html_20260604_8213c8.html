<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Studio Pro | Intelligent Barcode Suite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at 10% 20%, #0B0E17, #05070C);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      min-height: 100vh;
      padding: 2rem 1.5rem;
    }

    .app-container {
      max-width: 1480px;
      margin: 0 auto;
    }

    /* Modern glass header */
    .studio-header {
      text-align: center;
      margin-bottom: 2.5rem;
      animation: fadeSlide 0.5s ease-out;
    }
    .studio-header h1 {
      font-size: 2.8rem;
      font-weight: 800;
      background: linear-gradient(125deg, #FFFFFF, #9CA3AF, #60A5FA);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: -0.02em;
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }
    .studio-header h1 i {
      background: none;
      -webkit-background-clip: unset;
      background-clip: unset;
      color: #3b82f6;
      font-size: 2.2rem;
    }
    .badge-sub {
      background: rgba(59,130,246,0.2);
      backdrop-filter: blur(4px);
      display: inline-block;
      margin-top: 10px;
      padding: 0.3rem 1rem;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 500;
      color: #94a3b8;
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* Grid with better spacing */
    .generator-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2rem;
    }

    /* Neumorphic cards with smooth edges */
    .card {
      background: rgba(18, 22, 32, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 2rem;
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: 0 25px 40px -15px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.02);
      padding: 1.8rem;
      transition: transform 0.25s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.3s;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 30px 45px -18px black;
      border-color: rgba(59,130,246,0.3);
    }
    .card-title {
      font-size: 1.45rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
      border-left: 4px solid #3b82f6;
      padding-left: 1rem;
      margin-bottom: 1.75rem;
      color: #F1F5F9;
      letter-spacing: -0.2px;
    }

    .form-group {
      margin-bottom: 1.4rem;
    }
    label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #cbd5e6;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    label i {
      font-size: 0.85rem;
      color: #60a5fa;
    }
    input, select {
      width: 100%;
      padding: 0.85rem 1.1rem;
      border-radius: 1.25rem;
      border: 1.5px solid #232838;
      background: #0F121C;
      color: #F8FAFC;
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.2s;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.25);
      background: #131824;
    }
    input:disabled {
      background: #080b12;
      color: #4b5569;
      border-color: #1f293d;
      opacity: 0.8;
    }
    .input-hint {
      font-size: 0.7rem;
      color: #6b7c9f;
      margin-top: 0.3rem;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    button {
      background: #1e2a3e;
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 2rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      color: white;
    }
    button i { font-size: 1rem; }
    button:hover { background: #2d3a52; transform: scale(0.97); }
    .btn-primary {
      background: linear-gradient(95deg, #2563eb, #1e40af);
      box-shadow: 0 8px 18px rgba(37,99,235,0.3);
      border: none;
    }
    .btn-primary:hover { background: linear-gradient(95deg, #3b82f6, #2563eb); transform: scale(0.98); }
    .btn-outline {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid #334155;
      backdrop-filter: blur(4px);
    }
    .btn-outline:hover { background: #2d3a4f; border-color: #3b82f6; }

    /* Preview panel elegance */
    .preview-area {
      background: #0A0D14;
      border-radius: 1.6rem;
      padding: 1.5rem;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.5), 0 8px 20px rgba(0,0,0,0.3);
      border: 1px solid #1E293B;
    }
    .barcode-canvas-container {
      background: #FFFFFF;
      border-radius: 1.25rem;
      padding: 1rem;
      box-shadow: 0 10px 20px -5px rgba(0,0,0,0.4);
      transition: all 0.2s;
    }
    canvas#resultCanvas {
      width: 100%;
      height: auto;
      border-radius: 12px;
      display: block;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .preview-actions {
      display: flex;
      justify-content: center;
      margin-top: 1.2rem;
    }

    /* Extractor modernized */
    .extractor-section {
      margin-top: 2rem;
      background: rgba(8, 12, 20, 0.7);
      border-radius: 1.5rem;
      padding: 1.2rem;
      border: 1px solid #232838;
    }
    .extractor-row {
      display: flex;
      gap: 1rem;
      align-items: flex-end;
      flex-wrap: wrap;
    }
    .extractor-row .form-group {
      flex: 2;
      margin-bottom: 0;
    }
    .barcode-number-result {
      background: #0f172ad9;
      backdrop-filter: blur(8px);
      color: #FACC15;
      font-family: 'SF Mono', 'Fira Code', monospace;
      padding: 0.75rem;
      border-radius: 1.2rem;
      font-size: 1rem;
      font-weight: 500;
      word-break: break-all;
      margin-top: 12px;
      text-align: center;
      border-left: 3px solid #facc15;
    }
    .character-counter {
      font-size: 0.7rem;
      margin-top: 5px;
      text-align: right;
      font-weight: 500;
      color: #7e8aa8;
    }

    @media (max-width: 860px) {
      body { padding: 1rem; }
      .generator-grid { grid-template-columns: 1fr; gap: 1.5rem; }
      .card { padding: 1.3rem; }
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .toast-message {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293bdd;
      backdrop-filter: blur(12px);
      color: white;
      padding: 0.6rem 1.2rem;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 500;
      z-index: 1000;
      pointer-events: none;
      transition: opacity 0.2s;
      border: 1px solid #3b82f6;
    }
  </style>
</head>
<body>
<div class="app-container">
  <div class="studio-header">
    <h1><i class="fas fa-barcode"></i> Barcode Studio Pro</h1>
    <div class="badge-sub"><i class="fas fa-shopping-cart"></i> Retail‑grade · Instant preview · Smart extraction</div>
  </div>

  <div class="generator-grid">
    <!-- LEFT: Config panel -->
    <div class="card">
      <div class="card-title">
        <i class="fas fa-sliders-h"></i> Retail Configuration
      </div>
      <div class="form-group">
        <label><i class="fas fa-store"></i> Retailer Chain</label>
        <select id="retailerSelect">
          <option value="morrisons">Morrisons</option>
          <option value="sainsburys">Sainsbury's</option>
          <option value="asda">ASDA</option>
          <option value="asda2">ASDA Extra</option>
          <option value="mns">M&S Foodhall</option>
          <option value="waitrose">Waitrose & Partners</option>
          <option value="tesco">Tesco (Clubcard)</option>
        </select>
      </div>
      <div class="form-group">
        <label><i class="fas fa-keyboard"></i> Barcode Number <span style="font-weight:normal;">(up to 13 digits)</span></label>
        <input type="text" id="barcodeNumber" placeholder="e.g., 501234567890" inputmode="numeric" autocomplete="off">
        <div class="character-counter" id="barcodeCounter">0 / 13 digits</div>
      </div>
      <div class="form-group">
        <label><i class="fas fa-tag"></i> Price (GBP)</label>
        <input type="number" id="pricePence" min="1" max="99999" step="1" placeholder="e.g., 1250 for £12.50">
        <div class="input-hint"><i class="fas fa-info-circle"></i> Enter in pence · 1–99,999</div>
      </div>
      <div class="form-group">
        <label><i class="fas fa-bag-shopping"></i> Product Title</label>
        <input type="text" id="productName" placeholder="Fresh Organic Berries, Craft Beer..." value="Signature Item">
      </div>
      <button id="generateBtn" class="btn-primary"><i class="fas fa-sync-alt"></i> Generate & Refresh</button>
      
      <!-- Enhanced extractor -->
      <div class="extractor-section">
        <div style="font-weight:600; margin-bottom: 12px; color:#cbd5e6; font-size:0.85rem;"><i class="fas fa-robot"></i> AI Vision — Extract barcode from image</div>
        <div class="extractor-row">
          <div class="form-group">
            <input type="file" id="barcodeImageFile" accept="image/png, image/jpeg, image/jpg, image/webp">
          </div>
          <button id="extractBarcodeBtn" class="btn-outline"><i class="fas fa-microchip"></i> Scan & Extract</button>
        </div>
        <div id="extractedResult" class="barcode-number-result" style="display: none;"></div>
      </div>
    </div>

    <!-- RIGHT: Barcode preview canvas -->
    <div class="card">
      <div class="card-title">
        <i class="fas fa-qrcode"></i> Live Barcode Render
      </div>
      <div class="preview-area">
        <div class="barcode-canvas-container">
          <canvas id="resultCanvas" width="800" height="600" style="width:100%; height:auto; max-width:800px; border-radius: 16px; background: white;"></canvas>
        </div>
        <div class="preview-actions">
          <button id="downloadBtn" class="btn-outline"><i class="fas fa-cloud-download-alt"></i> Download PNG (High‑Res)</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // ----- Optimized and robust barcode engine -----
  let autoGenerationEnabled = false;     // Auto-update on input changes
  let suppressAutoTrigger = false;
  let currentRetailer = "morrisons";
  let tesseractReady = false;

  // Helper: luhn for ASDA variants
  function luhnCalculate(partial) {
    let len = partial.length;
    let parity = len % 2;
    let sum = 0;
    for (let i = len - 1; i >= 0; i--) {
      let digit = parseInt(partial.charAt(i), 10);
      if (i % 2 === parity) digit *= 2;
      if (digit > 9) digit -= 9;
      sum += digit;
    }
    let cs = sum % 10;
    return cs === 0 ? 0 : 10 - cs;
  }

  function calculateCheckDigitSainsburys(input) {
    let sum = 0;
    for (let i = 0; i < input.length; i++) {
      const digit = parseInt(input[input.length - 1 - i], 10);
      const weight = (i % 2 === 0) ? 3 : 1;
      sum += digit * weight;
    }
    return (10 - (sum % 10)) % 10;
  }

  function padLeft(num, size) {
    return num.toString().padStart(size, '0');
  }

  // Build final retail barcode according to specs
  function buildRetailBarcode(retailer, padded13Digit, pricePence) {
    const barcodeCore = padded13Digit.length === 13 ? padded13Digit : padded13Digit.padStart(13, '0');
    const price5 = padLeft(pricePence, 5);
    const price6 = padLeft(pricePence, 6);

    switch(retailer) {
      case 'morrisons': return `92${barcodeCore}${price5}600015`;
      case 'sainsburys': {
        const base = `91${barcodeCore}${price6}`;
        const cd = calculateCheckDigitSainsburys(base);
        return `${base}${cd}`;
      }
      case 'asda': {
        const baseA = `330${barcodeCore}${price5}2056`;
        const cs = luhnCalculate(baseA);
        return `${baseA}${cs}`;
      }
      case 'asda2': {
        const baseA2 = `510${barcodeCore}${price5}1960`;
        const cs = luhnCalculate(baseA2);
        return `${baseA2}${cs}`;
      }
      case 'mns': return `822${barcodeCore}00160${price5}`;
      case 'waitrose': return `10${barcodeCore}${price5}`;
      case 'tesco': return `971${barcodeCore.slice(0,13)}70000408`;
      default: return `92${barcodeCore}${price5}600015`;
    }
  }

  // Clean and limit digits
  function sanitizeBarcodeDigits(value) {
    let digits = value.replace(/\D/g, '');
    if (digits.length > 13) digits = digits.slice(0, 13);
    return digits;
  }

  function updateCounterAndSync() {
    const inputEl = document.getElementById('barcodeNumber');
    let raw = inputEl.value;
    let digits = sanitizeBarcodeDigits(raw);
    if (digits !== raw) inputEl.value = digits;
    const counterSpan = document.getElementById('barcodeCounter');
    const len = digits.length;
    counterSpan.innerText = `${len} / 13 digits`;
    if (len === 13) counterSpan.style.color = '#4ade80';
    else if (len >= 8) counterSpan.style.color = '#facc15';
    else counterSpan.style.color = '#7e8aa8';
    return digits;
  }

  function enforcePriceRange() {
    const priceField = document.getElementById('pricePence');
    if (priceField.disabled) return;
    let val = priceField.value.trim();
    if (val === '') return;
    let num = parseInt(val, 10);
    if (isNaN(num)) { priceField.value = ''; return; }
    if (num < 1) priceField.value = 1;
    if (num > 99999) priceField.value = 99999;
  }

  function updatePriceFieldByRetailer() {
    const retailer = document.getElementById('retailerSelect').value;
    const priceField = document.getElementById('pricePence');
    if (retailer === 'tesco') {
      priceField.disabled = true;
      priceField.value = '';
      priceField.placeholder = 'N/A for Tesco';
    } else {
      priceField.disabled = false;
      priceField.placeholder = 'e.g., 550 for £5.50';
      if (!priceField.value) priceField.value = '';
    }
  }

  // Core rendering with polished typography + error resilience
  async function renderBarcodeArt(retailer, rawDigits, pricePence, productName) {
    const cleanedDigits = sanitizeBarcodeDigits(rawDigits);
    const paddedBarcode = cleanedDigits.padStart(13, '0');
    const fullBarcodeString = buildRetailBarcode(retailer, paddedBarcode, pricePence);
    const canvas = document.getElementById('resultCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 800;
    canvas.height = 600;
    
    // white bg
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Retailer display name
    const storeNames = {
      morrisons: 'Morrisons', sainsburys: "Sainsbury's", asda: 'ASDA', asda2: 'ASDA Extra',
      mns: 'M&S', waitrose: 'Waitrose', tesco: 'Tesco'
    };
    const storeDisplay = storeNames[retailer] || 'Retail';
    
    ctx.font = '600 28px "Inter", "Segoe UI", system-ui';
    ctx.fillStyle = '#1A2C3E';
    ctx.fillText(storeDisplay, 28, 58);
    
    // Product name with smart truncate
    let product = productName?.trim() || "Select Product";
    ctx.font = '700 72px "Inter", "Segoe UI", system-ui';
    let maxWidth = canvas.width - 80;
    let currentFontSize = 72;
    let textWidth = ctx.measureText(product).width;
    let displayProduct = product;
    while (textWidth > maxWidth && currentFontSize > 32) {
      currentFontSize -= 6;
      ctx.font = `700 ${currentFontSize}px "Inter", "Segoe UI", system-ui`;
      textWidth = ctx.measureText(displayProduct).width;
      if (textWidth > maxWidth && displayProduct.length > 8) {
        displayProduct = displayProduct.slice(0, Math.max(12, displayProduct.length - 3)) + '…';
        textWidth = ctx.measureText(displayProduct).width;
      }
    }
    const prodX = (canvas.width - textWidth) / 2;
    ctx.fillStyle = '#111827';
    ctx.fillText(displayProduct, prodX, 210);
    
    // Price or Tesco 4p
    if (retailer === 'tesco') {
      ctx.font = '700 76px "Inter", "Segoe UI"';
      const tescoPriceText = '4p';
      const priceWidth = ctx.measureText(tescoPriceText).width;
      ctx.fillStyle = '#B91C1C';
      ctx.fillText(tescoPriceText, (canvas.width - priceWidth) / 2, 330);
    } else {
      const pricePounds = (pricePence / 100).toFixed(2);
      const priceText = `£${pricePounds}`;
      ctx.font = '700 85px "Inter", "Segoe UI"';
      let priceWidth = ctx.measureText(priceText).width;
      let priceX = (canvas.width - priceWidth) / 2;
      ctx.fillStyle = '#0F3B2C';
      ctx.fillText(priceText, priceX, 335);
    }
    
    // generate barcode via jsbarcode offscreen
    const bcCanvas = document.createElement('canvas');
    bcCanvas.width = 520;
    bcCanvas.height = 110;
    try {
      JsBarcode(bcCanvas, fullBarcodeString, {
        format: "CODE128",
        width: 2.1,
        height: 88,
        displayValue: false,
        background: "#ffffff",
        lineColor: "#000000",
        margin: 0
      });
    } catch(e) { console.warn(e); }
    const barcodeX = (canvas.width - 520) / 2;
    ctx.drawImage(bcCanvas, barcodeX, 400, 520, 100);
    
    ctx.font = '500 13px "SF Mono", "Fira Code", monospace';
    ctx.fillStyle = '#334155';
    let displayCode = fullBarcodeString;
    if (displayCode.length > 30) displayCode = displayCode.slice(0, 28) + '…';
    ctx.fillText(displayCode, barcodeX + 15, 545);
    return { fullBarcodeString };
  }

  async function generateAndRender() {
    if (suppressAutoTrigger) return;
    const retailer = document.getElementById('retailerSelect').value;
    currentRetailer = retailer;
    
    let barcodeDigits = updateCounterAndSync();
    let price = 100;
    if (retailer !== 'tesco') {
      let priceRaw = document.getElementById('pricePence').value;
      if (priceRaw === '' || priceRaw === null) price = 100;
      else {
        let num = parseInt(priceRaw, 10);
        if (isNaN(num)) price = 100;
        else price = Math.min(99999, Math.max(1, num));
      }
      document.getElementById('pricePence').value = price;
    } else {
      price = 0;
    }
    
    let product = document.getElementById('productName').value;
    if (!product || product.trim() === "") product = "Artisan Goods";
    
    try {
      await renderBarcodeArt(retailer, barcodeDigits, price, product);
    } catch (err) {
      console.error(err);
      const canvas = document.getElementById('resultCanvas');
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#dc2626';
      ctx.font = '20px "Inter"';
      ctx.textAlign = 'center';
      ctx.fillText("⚠️ Barcode generation error, check input", canvas.width/2, canvas.height/2);
      ctx.textAlign = 'left';
    }
  }
  
  function autoTrigger() {
    if (autoGenerationEnabled && !suppressAutoTrigger) generateAndRender();
  }
  
  // ----- Image extraction with Tesseract lazy load + fallback -----
  let tesseractLoaded = false;
  function ensureTesseract() {
    return new Promise((resolve) => {
      if (window.Tesseract) { tesseractLoaded = true; resolve(true); }
      else if (!document.querySelector('#tesseract-script')) {
        const script = document.createElement('script');
        script.id = 'tesseract-script';
        script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
        script.onload = () => { tesseractLoaded = true; resolve(true); };
        script.onerror = () => resolve(false);
        document.head.appendChild(script);
      } else { setTimeout(() => resolve(window.Tesseract ? true : false), 400); }
    });
  }
  
  async function extractFromImage(file) {
    await ensureTesseract();
    if (window.Tesseract) {
      try {
        const { data: { text } } = await window.Tesseract.recognize(file, 'eng', { logger: m => m });
        const digitsOnly = text.replace(/\D/g, '');
        let matches = digitsOnly.match(/\d{8,}/g);
        let best = matches ? matches.reduce((a,b) => a.length >= b.length ? a : b) : digitsOnly;
        if (best && best.length >= 8) {
          if (best.length > 13) best = best.slice(0,13);
          return best;
        }
        throw new Error("No sufficient digits found");
      } catch (err) {
        throw new Error("OCR failed: " + err.message);
      }
    } else {
      const manual = prompt("OCR library still loading. Enter barcode digits manually (max 13 digits):");
      if (manual && /^\d+$/.test(manual.replace(/\D/g,''))) {
        let clean = manual.replace(/\D/g,'');
        if (clean.length > 13) clean = clean.slice(0,13);
        return clean;
      }
      throw new Error("Manual input cancelled or invalid");
    }
  }
  
  async function handleExtract() {
    const fileInput = document.getElementById('barcodeImageFile');
    const file = fileInput.files[0];
    const resultDiv = document.getElementById('extractedResult');
    if (!file) {
      resultDiv.style.display = 'block';
      resultDiv.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Please upload a barcode image';
      setTimeout(() => { if (resultDiv.style.display === 'block') resultDiv.style.display = 'none'; }, 2500);
      return;
    }
    resultDiv.style.display = 'block';
    resultDiv.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Processing image with OCR...';
    try {
      const extracted = await extractFromImage(file);
      resultDiv.innerHTML = `<i class="fas fa-check-circle"></i> Extracted: <strong style="font-size:1rem;">${extracted}</strong> (${extracted.length} digits) 
      <button id="useExtractedBtn" style="background:#2563eb; margin-left:12px; padding:4px 14px; border-radius:30px; font-size:0.75rem; font-weight:600; border:none; color:white; cursor:pointer;">Apply</button>`;
      const useBtn = document.getElementById('useExtractedBtn');
      if (useBtn) {
        useBtn.onclick = () => {
          document.getElementById('barcodeNumber').value = extracted;
          updateCounterAndSync();
          if (autoGenerationEnabled) generateAndRender();
          resultDiv.style.display = 'none';
          showToast("Barcode number applied");
        };
      }
    } catch (err) {
      resultDiv.innerHTML = `<i class="fas fa-times-circle"></i> ${err.message || "Extraction failed. Try clearer image."}`;
      setTimeout(() => { if (resultDiv.style.display === 'block') resultDiv.style.display = 'none'; }, 4000);
    }
  }
  
  function showToast(msg) {
    let existing = document.querySelector('.toast-message');
    if(existing) existing.remove();
    let div = document.createElement('div');
    div.className = 'toast-message';
    div.innerHTML = `<i class="fas fa-check-circle"></i> ${msg}`;
    document.body.appendChild(div);
    setTimeout(() => div.remove(), 2000);
  }
  
  function manualGenerateAndEnableAuto() {
    updateCounterAndSync();
    enforcePriceRange();
    if (!autoGenerationEnabled) autoGenerationEnabled = true;
    generateAndRender();
  }
  
  function downloadCanvas() {
    const canvas = document.getElementById('resultCanvas');
    const link = document.createElement('a');
    link.download = `barcode_${currentRetailer}_${Date.now()}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast("PNG saved");
  }
  
  // ----- Event listeners -----
  document.getElementById('generateBtn').addEventListener('click', manualGenerateAndEnableAuto);
  document.getElementById('downloadBtn').addEventListener('click', downloadCanvas);
  document.getElementById('extractBarcodeBtn').addEventListener('click', handleExtract);
  
  const barcodeInput = document.getElementById('barcodeNumber');
  barcodeInput.addEventListener('input', () => {
    let digits = sanitizeBarcodeDigits(barcodeInput.value);
    barcodeInput.value = digits;
    updateCounterAndSync();
    autoTrigger();
  });
  
  const priceField = document.getElementById('pricePence');
  priceField.addEventListener('input', () => {
    if (!priceField.disabled) enforcePriceRange();
    autoTrigger();
  });
  document.getElementById('retailerSelect').addEventListener('change', () => {
    updatePriceFieldByRetailer();
    autoTrigger();
  });
  document.getElementById('productName').addEventListener('input', () => autoTrigger());
  
  // initial load
  window.addEventListener('load', () => {
    updatePriceFieldByRetailer();
    updateCounterAndSync();
    barcodeInput.value = "";
    document.getElementById('productName').value = "Artisan Selection";
    autoGenerationEnabled = true;
    generateAndRender();
  });
</script>
</body>
</html>
